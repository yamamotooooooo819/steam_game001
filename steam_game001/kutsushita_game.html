<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>靴下の片割れ探し</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background: #f5f0e8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(200,190,170,0.1) 20px, rgba(200,190,170,0.1) 21px);
    pointer-events: none;
  }

  header {
    width: 100%;
    background: #2c2c2c;
    color: #f5f0e8;
    text-align: center;
    padding: 16px 20px 12px;
  }

  header h1 { font-size: 1.5rem; font-weight: 800; }
  header .subtitle { font-size: 0.75rem; color: #aaa; margin-top: 2px; }

  .stats-bar {
    display: flex;
    gap: 20px;
    justify-content: center;
    background: #3a3a3a;
    width: 100%;
    padding: 8px 20px;
    color: #f5f0e8;
    font-size: 0.85rem;
  }

  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-val { font-weight: 800; color: #f4c542; }

  .main {
    display: flex;
    gap: 20px;
    padding: 20px;
    width: 100%;
    max-width: 900px;
    flex-wrap: wrap;
  }

  .basket {
    flex: 1;
    min-width: 260px;
    background: #fff;
    border-radius: 16px;
    border: 3px solid #2c2c2c;
    box-shadow: 6px 6px 0 #2c2c2c;
    overflow: hidden;
  }

  .basket-header {
    background: #2c2c2c;
    color: #f5f0e8;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .basket-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 12px;
    min-height: 200px;
  }

  .workbench {
    flex: 1;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .selected-area {
    background: #fff;
    border-radius: 16px;
    border: 3px solid #2c2c2c;
    box-shadow: 6px 6px 0 #2c2c2c;
    overflow: hidden;
    min-height: 140px;
  }

  .selected-header {
    background: #e87c6a;
    color: white;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .selected-slots {
    display: flex;
    gap: 12px;
    padding: 16px;
    align-items: center;
    flex-wrap: wrap;
  }

  .slot {
    width: 72px;
    height: 72px;
    border: 3px dashed #ccc;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    background: #fafafa;
    transition: all 0.2s;
    position: relative;
  }

  .slot.filled {
    border-style: solid;
    border-color: #e87c6a;
    background: #fff5f3;
    cursor: pointer;
  }

  .slot .remove-btn {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 20px;
    height: 20px;
    background: #2c2c2c;
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 0.65rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .match-btn {
    background: #2c2c2c;
    color: #f5f0e8;
    border: none;
    border-radius: 12px;
    padding: 12px 24px;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 4px 4px 0 #888;
  }

  .match-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 #888; }
  .match-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #888; }
  .match-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .sock-card {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 12px;
    border: 3px solid #2c2c2c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 3px 3px 0 #2c2c2c;
    position: relative;
    user-select: none;
  }

  .sock-card:hover { transform: translate(-2px, -2px) rotate(-3deg); box-shadow: 5px 5px 0 #2c2c2c; }
  .sock-card.selected { border-color: #e87c6a; box-shadow: 3px 3px 0 #e87c6a; transform: scale(0.95); }

  .sock-label {
    font-size: 0.4rem;
    color: rgba(0,0,0,0.4);
    font-weight: 700;
    margin-top: 2px;
  }

  .pairs-tray {
    background: #fff;
    border-radius: 16px;
    border: 3px solid #2c2c2c;
    box-shadow: 6px 6px 0 #2c2c2c;
    overflow: hidden;
  }

  .pairs-header {
    background: #5ab07a;
    color: white;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .pairs-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px;
    min-height: 60px;
  }

  .pair-chip {
    background: #e8f7ee;
    border: 2px solid #5ab07a;
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 1.1rem;
    animation: popIn 0.3s ease;
  }

  @keyframes popIn {
    0% { transform: scale(0); }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #2c2c2c;
    color: white;
    padding: 10px 20px;
    border-radius: 40px;
    font-size: 0.9rem;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  .overlay.show { display: flex; }

  .result-box {
    background: #fff;
    border: 4px solid #2c2c2c;
    border-radius: 24px;
    box-shadow: 8px 8px 0 #2c2c2c;
    padding: 32px 40px;
    text-align: center;
    max-width: 360px;
  }

  .result-box h2 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
  .result-box p { color: #666; margin-bottom: 12px; font-size: 0.9rem; }

  .result-btn {
    background: #e87c6a;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 28px;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 4px 4px 0 #c05a4a;
    margin-top: 8px;
  }

  .lonely-badge {
    background: #fff3cd;
    border: 2px solid #f4c542;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.8rem;
    color: #7a6010;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>🧦 靴下の片割れ探し</h1>
  <div class="subtitle">洗濯物の中からペアを見つけろ！</div>
</header>

<div class="stats-bar">
  <div class="stat">⏱ タイム: <span class="stat-val" id="timer">0:00</span></div>
  <div class="stat">✅ ペア: <span class="stat-val" id="pair-count">0</span> / <span id="total-pairs">0</span></div>
  <div class="stat">❌ ミス: <span class="stat-val" id="miss-count">0</span></div>
</div>

<div class="main">
  <div class="workbench">
    <div class="selected-area">
      <div class="selected-header">🖐 選んだ靴下（2枚選んでペアにする）</div>
      <div class="selected-slots">
        <div class="slot" id="slot-a"><span style="color:#ccc;font-size:1rem">?</span></div>
        <div style="font-size:1.5rem; color:#2c2c2c;">＋</div>
        <div class="slot" id="slot-b"><span style="color:#ccc;font-size:1rem">?</span></div>
        <button class="match-btn" id="match-btn" disabled onclick="tryMatch()">ペアにする！</button>
      </div>
    </div>

    <div class="pairs-tray">
      <div class="pairs-header">🎉 完成したペア</div>
      <div class="pairs-grid" id="pairs-grid">
        <span style="color:#ccc;font-size:0.8rem;padding:4px;">まだなし</span>
      </div>
    </div>
  </div>

  <div class="basket">
    <div class="basket-header">🧺 洗濯かご（クリックして選ぼう）</div>
    <div class="basket-grid" id="basket-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="result-box">
    <h2>🎊 完了！</h2>
    <p id="result-msg"></p>
    <div class="lonely-badge" id="lonely-badge" style="display:none"></div>
    <button class="result-btn" onclick="startGame()">もう一回やる</button>
  </div>
</div>

<script>
const SOCK_TYPES = [
  { id: 'A', emoji: '🔴', name: '赤ボーダー' },
  { id: 'B', emoji: '🔵', name: '紺無地' },
  { id: 'C', emoji: '🟡', name: '黄色水玉' },
  { id: 'D', emoji: '🟢', name: '緑チェック' },
  { id: 'E', emoji: '🟠', name: 'オレンジ縞' },
  { id: 'F', emoji: '🟣', name: '紫星柄' },
  { id: 'G', emoji: '⚫', name: '黒シンプル' },
  { id: 'H', emoji: '⚪', name: '白スポーツ' },
];
const LONELY = { id: 'X', emoji: '🌸', name: '謎の花柄', lonely: true };

const COLORS = {
  A: '#ffe5e5', B: '#e5eeff', C: '#fffbe5', D: '#e5ffee',
  E: '#fff0e5', F: '#f0e5ff', G: '#efefef', H: '#f9f9f9', X: '#fff0f7'
};

let socks = [], selected = [null, null], pairs = 0, totalPairs = 0, misses = 0;
let timerInterval = null, seconds = 0;

function startGame() {
  clearInterval(timerInterval);
  seconds = 0; pairs = 0; misses = 0; selected = [null, null];
  document.getElementById('overlay').classList.remove('show');
  updateStats();

  const pairTypes = SOCK_TYPES.slice(0, 7);
  totalPairs = pairTypes.length;
  socks = [];
  let id = 0;
  pairTypes.forEach(t => {
    socks.push({ uid: id++, type: t, paired: false, selected: false });
    socks.push({ uid: id++, type: t, paired: false, selected: false });
  });
  socks.push({ uid: id++, type: LONELY, paired: false, selected: false, lonely: true });
  socks.sort(() => Math.random() - 0.5);

  document.getElementById('total-pairs').textContent = totalPairs;
  document.getElementById('pairs-grid').innerHTML = '<span style="color:#ccc;font-size:0.8rem;padding:4px;">まだなし</span>';
  resetSlots();
  renderBasket();

  timerInterval = setInterval(() => {
    seconds++;
    const m = Math.floor(seconds / 60), s = seconds % 60;
    document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

function renderBasket() {
  const grid = document.getElementById('basket-grid');
  grid.innerHTML = '';
  socks.filter(s => !s.paired).forEach(sock => {
    const card = document.createElement('div');
    card.className = 'sock-card' + (sock.selected ? ' selected' : '');
    card.style.background = COLORS[sock.type.id] || '#eee';
    card.innerHTML = `<span>${sock.type.emoji}</span><span class="sock-label">${sock.type.name}</span>`;
    card.onclick = () => selectSock(sock.uid);
    grid.appendChild(card);
  });
}

function selectSock(uid) {
  const sock = socks.find(s => s.uid === uid);
  if (!sock || sock.paired) return;

  if (sock.selected) {
    sock.selected = false;
    if (selected[0] === uid) selected[0] = null;
    else selected[1] = null;
  } else {
    if (selected[0] === null) { selected[0] = uid; sock.selected = true; }
    else if (selected[1] === null && selected[0] !== uid) { selected[1] = uid; sock.selected = true; }
  }

  renderBasket();
  updateSlots();
  document.getElementById('match-btn').disabled = selected.filter(s => s !== null).length < 2;
}

function updateSlots() {
  ['a','b'].forEach((slot, i) => {
    const el = document.getElementById(`slot-${slot}`);
    const uid = selected[i];
    if (uid !== null) {
      const sock = socks.find(s => s.uid === uid);
      el.className = 'slot filled';
      el.innerHTML = `<span style="font-size:2rem">${sock.type.emoji}</span><button class="remove-btn" onclick="removeSock(${uid})">✕</button>`;
    } else {
      el.className = 'slot';
      el.innerHTML = '<span style="color:#ccc;font-size:1rem">?</span>';
    }
  });
}

function removeSock(uid) {
  const sock = socks.find(s => s.uid === uid);
  if (sock) sock.selected = false;
  if (selected[0] === uid) selected[0] = null;
  else if (selected[1] === uid) selected[1] = null;
  renderBasket(); updateSlots();
  document.getElementById('match-btn').disabled = true;
}

function resetSlots() { selected = [null, null]; updateSlots(); document.getElementById('match-btn').disabled = true; }

function tryMatch() {
  const [uid1, uid2] = selected;
  if (uid1 === null || uid2 === null) return;
  const s1 = socks.find(s => s.uid === uid1), s2 = socks.find(s => s.uid === uid2);

  if (s1.type.id === s2.type.id && !s1.lonely && !s2.lonely) {
    s1.paired = s2.paired = true;
    s1.selected = s2.selected = false;
    pairs++;
    const grid = document.getElementById('pairs-grid');
    if (grid.querySelector('span[style]')) grid.innerHTML = '';
    const chip = document.createElement('div');
    chip.className = 'pair-chip';
    chip.textContent = s1.type.emoji + s1.type.emoji;
    grid.appendChild(chip);
    showToast(`✅ ${s1.type.name} のペア完成！`);
    resetSlots(); renderBasket(); updateStats();
    if (pairs >= totalPairs) setTimeout(showResult, 400);
  } else {
    misses++;
    updateStats();
    showToast('❌ 違う！片割れだ…');
    s1.selected = s2.selected = false;
    selected = [null, null];
    renderBasket(); resetSlots();
  }
}

function updateStats() {
  document.getElementById('pair-count').textContent = pairs;
  document.getElementById('miss-count').textContent = misses;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function showResult() {
  clearInterval(timerInterval);
  const m = Math.floor(seconds / 60), s = seconds % 60;
  document.getElementById('result-msg').textContent =
    `${totalPairs}ペア完成！ タイム: ${m}:${s.toString().padStart(2,'0')}　ミス: ${misses}回`;
  const badge = document.getElementById('lonely-badge');
  badge.style.display = 'block';
  badge.textContent = '🌸「謎の花柄」の片割れは永遠に見つかりませんでした';
  document.getElementById('overlay').classList.add('show');
}

startGame();
</script>
</body>
</html>

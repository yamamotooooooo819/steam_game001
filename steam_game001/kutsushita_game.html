<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>靴下の片割れ探し</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background: #f5f0e8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(200,190,170,0.1) 20px, rgba(200,190,170,0.1) 21px);
    pointer-events: none;
  }

  header {
    width: 100%;
    background: #2c2c2c;
    color: #f5f0e8;
    text-align: center;
    padding: 16px 20px 12px;
  }

  header h1 { font-size: 1.5rem; font-weight: 800; }
  header .subtitle { font-size: 0.75rem; color: #aaa; margin-top: 2px; }

  .stats-bar {
    display: flex;
    gap: 20px;
    justify-content: center;
    background: #3a3a3a;
    width: 100%;
    padding: 8px 20px;
    color: #f5f0e8;
    font-size: 0.85rem;
  }

  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-val { font-weight: 800; color: #f4c542; }

  .main {
    display: flex;
    gap: 20px;
    padding: 20px;
    width: 100%;
    max-width: 900px;
    flex-wrap: wrap;
  }

  .basket {
    flex: 1;
    min-width: 260px;
    background: #fff;
    border-radius: 16px;
    border: 3px solid #2c2c2c;
    box-shadow: 6px 6px 0 #2c2c2c;
    overflow: hidden;
  }

  .basket-header {
    background: #2c2c2c;
    color: #f5f0e8;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .basket-grid {
    position: relative;
    width: 100%;
    height: 360px;
    overflow: hidden;
  }

  .workbench {
    flex: 1;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .selected-area {
    background: #fff;
    border-radius: 16px;
    border: 3px solid #2c2c2c;
    box-shadow: 6px 6px 0 #2c2c2c;
    overflow: visible;
    min-height: 140px;
  }

  .selected-header {
    background: #e87c6a;
    color: white;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 700;
    border-radius: 13px 13px 0 0;
  }

  .selected-slots {
    display: flex;
    gap: 12px;
    padding: 16px;
    align-items: center;
    flex-wrap: wrap;
  }

  .slot {
    width: 76px;
    height: 80px;
    border: 3px dashed #ccc;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafafa;
    transition: transform 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
    position: relative;
    overflow: visible;
  }

  .slot.drag-over {
    border-style: solid;
    border-color: #5ab07a;
    background: #edfff4;
    transform: scale(1.1);
    box-shadow: 0 0 12px rgba(90,176,122,0.5);
  }

  .slot.filled {
    border-style: solid;
    border-color: #e87c6a;
    background: #fff5f3;
    cursor: pointer;
  }

  .slot .remove-btn {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 20px;
    height: 20px;
    background: #2c2c2c;
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 0.65rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .match-btn {
    background: #2c2c2c;
    color: #f5f0e8;
    border: none;
    border-radius: 12px;
    padding: 12px 24px;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 4px 4px 0 #888;
  }

  .match-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 #888; }
  .match-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #888; }
  .match-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .sock-card {
    position: absolute;
    width: 62px;
    height: 78px;
    border: none;
    background: transparent;
    cursor: grab;
    touch-action: none;
    transform: rotate(var(--rot, 0deg));
    transition: transform 0.15s, filter 0.15s;
    user-select: none;
    overflow: visible;
  }

  .sock-card:active { cursor: grabbing; }

  .sock-card:hover {
    transform: rotate(var(--rot, 0deg)) translate(-2px, -5px) scale(1.08);
    filter: drop-shadow(4px 7px 6px rgba(0,0,0,0.35));
    z-index: 100 !important;
  }

  .sock-card.selected {
    transform: rotate(var(--rot, 0deg)) scale(0.88);
    filter: drop-shadow(0 0 10px rgba(232,124,106,1)) drop-shadow(0 0 5px rgba(232,124,106,0.7));
    z-index: 50 !important;
  }

  .laundry-item {
    position: absolute;
    pointer-events: none;
    user-select: none;
    overflow: visible;
    transform: rotate(var(--rot, 0deg));
    opacity: 0.88;
  }

  .pairs-tray {
    background: #fff;
    border-radius: 16px;
    border: 3px solid #2c2c2c;
    box-shadow: 6px 6px 0 #2c2c2c;
    overflow: hidden;
  }

  .pairs-header {
    background: #5ab07a;
    color: white;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .pairs-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px;
    min-height: 60px;
  }

  .pair-chip {
    display: flex;
    gap: 2px;
    align-items: center;
    background: #e8f7ee;
    border: 2px solid #5ab07a;
    border-radius: 20px;
    padding: 4px 10px;
    animation: popIn 0.3s ease;
  }

  .pair-chip .chip-sock {
    width: 20px;
    height: 26px;
  }

  @keyframes popIn {
    0% { transform: scale(0); }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #2c2c2c;
    color: white;
    padding: 10px 20px;
    border-radius: 40px;
    font-size: 0.9rem;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  .overlay.show { display: flex; }

  .result-box {
    background: #fff;
    border: 4px solid #2c2c2c;
    border-radius: 24px;
    box-shadow: 8px 8px 0 #2c2c2c;
    padding: 32px 40px;
    text-align: center;
    max-width: 360px;
  }

  .result-box h2 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
  .result-box p { color: #666; margin-bottom: 12px; font-size: 0.9rem; }

  .result-btn {
    background: #e87c6a;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 28px;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 4px 4px 0 #c05a4a;
    margin-top: 8px;
  }

  .lonely-badge {
    background: #fff3cd;
    border: 2px solid #f4c542;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.8rem;
    color: #7a6010;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>🧦 靴下の片割れ探し</h1>
  <div class="subtitle">洗濯物の中からペアを見つけろ！</div>
</header>

<div class="stats-bar">
  <div class="stat">⏱ タイム: <span class="stat-val" id="timer">0:00</span></div>
  <div class="stat">✅ ペア: <span class="stat-val" id="pair-count">0</span> / <span id="total-pairs">0</span></div>
  <div class="stat">❌ ミス: <span class="stat-val" id="miss-count">0</span></div>
</div>

<div class="main">
  <div class="workbench">
    <div class="selected-area">
      <div class="selected-header">🖐 選んだ靴下（2枚選んでペアにする）</div>
      <div class="selected-slots">
        <div class="slot" id="slot-a"><span style="color:#ccc;font-size:1rem">?</span></div>
        <div style="font-size:1.5rem; color:#2c2c2c;">＋</div>
        <div class="slot" id="slot-b"><span style="color:#ccc;font-size:1rem">?</span></div>
        <button class="match-btn" id="match-btn" disabled onclick="tryMatch()">ペアにする！</button>
      </div>
    </div>

    <div class="pairs-tray">
      <div class="pairs-header">🎉 完成したペア</div>
      <div class="pairs-grid" id="pairs-grid">
        <span style="color:#ccc;font-size:0.8rem;padding:4px;">まだなし</span>
      </div>
    </div>
  </div>

  <div class="basket">
    <div class="basket-header">🧺 洗濯かご（クリックして選ぼう）</div>
    <div class="basket-grid" id="basket-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="result-box">
    <h2>🎊 完了！</h2>
    <p id="result-msg"></p>
    <div class="lonely-badge" id="lonely-badge" style="display:none"></div>
    <button class="result-btn" onclick="startGame()">もう一回やる</button>
  </div>
</div>

<script>
// ─── Sock definitions ─────────────────────────────────────────────────────
const SOCK_TYPES = [
  { id:'A', name:'赤ボーダー',   base:'#d94f4f', cuff:'#b83a3a', toe:'#b83a3a', pat:'hstripes', patCol:'#ffffff' },
  { id:'B', name:'紺無地',       base:'#2b4590', cuff:'#1e3270', toe:'#1e3270', pat:'solid',    patCol:null },
  { id:'C', name:'黄色水玉',     base:'#f0c020', cuff:'#d8a010', toe:'#d8a010', pat:'dots',     patCol:'#c86018' },
  { id:'D', name:'緑チェック',   base:'#48a868', cuff:'#357a4c', toe:'#357a4c', pat:'check',    patCol:'#1a5c34' },
  { id:'E', name:'オレンジ縞',   base:'#e87040', cuff:'#c85020', toe:'#c85020', pat:'vstripes', patCol:'#ffffff' },
  { id:'F', name:'紫星柄',       base:'#7848b8', cuff:'#5830a0', toe:'#5830a0', pat:'stars',    patCol:'#f8d840' },
  { id:'G', name:'黒シンプル',   base:'#282828', cuff:'#141414', toe:'#141414', pat:'solid',    patCol:null },
  { id:'H', name:'白スポーツ',   base:'#ececec', cuff:'#d0d0d0', toe:'#d0d0d0', pat:'sport',    patCol:'#2b4590' },
];
const LONELY = { id:'X', name:'謎の花柄', lonely:true, base:'#f090b8', cuff:'#d86098', toe:'#d86098', pat:'flowers', patCol:'#d02878' };

// ─── SVG sock shape paths (viewBox 0 0 80 100, side-profile, toe→right) ──
const BODY_PATH = 'M8,0 L38,0 Q42,0 42,5 L42,60 Q42,72 54,78 L70,78 Q78,78 78,88 Q78,100 68,100 L15,100 Q3,98 2,88 Q0,76 8,65 Z';
const CUFF_PATH = 'M8,0 L38,0 Q42,0 42,5 L42,22 L8,22 Z';
const TOE_PATH  = 'M62,78 L70,78 Q78,78 78,88 Q78,100 68,100 L54,100 L54,78 Z';
const HEEL_PATH = 'M2,88 Q0,76 8,65 L14,69 Q8,78 8,88 Q9,96 16,100 L8,100 Q3,98 2,88 Z';

function createSockSVG(t, sfx) {
  // cuff ribbing vertical lines
  const ribs = [];
  for (let x = 12; x < 41; x += 5)
    ribs.push(`<line x1="${x}" y1="1" x2="${x}" y2="21" stroke="rgba(0,0,0,0.22)" stroke-width="1.5" stroke-linecap="round"/>`);

  // pattern definition
  let pDef = '', pFill = '';
  switch (t.pat) {
    case 'hstripes':
      pDef  = `<pattern id="p${sfx}" x="0" y="0" width="80" height="12" patternUnits="userSpaceOnUse"><rect width="80" height="6" fill="${t.patCol}" opacity="0.72"/></pattern>`;
      pFill = `url(#p${sfx})`; break;
    case 'vstripes':
      pDef  = `<pattern id="p${sfx}" x="0" y="0" width="10" height="100" patternUnits="userSpaceOnUse"><rect width="5" height="100" fill="${t.patCol}" opacity="0.60"/></pattern>`;
      pFill = `url(#p${sfx})`; break;
    case 'dots':
      pDef  = `<pattern id="p${sfx}" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="3.5" fill="${t.patCol}" opacity="0.88"/></pattern>`;
      pFill = `url(#p${sfx})`; break;
    case 'check':
      pDef  = `<pattern id="p${sfx}" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="${t.patCol}" opacity="0.42"/><rect x="8" y="8" width="8" height="8" fill="${t.patCol}" opacity="0.42"/></pattern>`;
      pFill = `url(#p${sfx})`; break;
    case 'stars':
      pDef  = `<pattern id="p${sfx}" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><text x="10" y="15" text-anchor="middle" font-size="13" fill="${t.patCol}">&#x2605;</text></pattern>`;
      pFill = `url(#p${sfx})`; break;
    case 'flowers':
      pDef  = `<pattern id="p${sfx}" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><text x="10" y="15" text-anchor="middle" font-size="12" fill="${t.patCol}">&#x273F;</text></pattern>`;
      pFill = `url(#p${sfx})`; break;
  }

  // sport sock: two colored cuff stripes instead of a body pattern
  const sport = t.pat === 'sport' ? `
    <rect x="8" y="5" width="34" height="4" fill="${t.patCol}" opacity="0.85" clip-path="url(#c${sfx})"/>
    <rect x="8" y="12" width="34" height="4" fill="${t.patCol}" opacity="0.85" clip-path="url(#c${sfx})"/>` : '';

  return `<svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;overflow:visible">
  <defs>
    <clipPath id="c${sfx}"><path d="${BODY_PATH}"/></clipPath>
    ${pDef}
    <linearGradient id="g${sfx}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(0,0,0,0.20)"/>
      <stop offset="22%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="72%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.25)"/>
    </linearGradient>
    <filter id="f${sfx}" x="-15%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3.5" flood-color="rgba(0,0,0,0.30)"/>
    </filter>
  </defs>

  <!-- base shape with shadow -->
  <path d="${BODY_PATH}" fill="${t.base}" filter="url(#f${sfx})"/>

  <!-- body pattern -->
  ${pFill ? `<rect width="80" height="100" fill="${pFill}" clip-path="url(#c${sfx})"/>` : ''}
  ${sport}

  <!-- toe reinforcement -->
  <path d="${TOE_PATH}"  fill="${t.toe}"  opacity="0.58" clip-path="url(#c${sfx})"/>

  <!-- heel reinforcement -->
  <path d="${HEEL_PATH}" fill="rgba(0,0,0,0.18)" clip-path="url(#c${sfx})"/>

  <!-- cuff darker band -->
  <path d="${CUFF_PATH}" fill="${t.cuff}" opacity="0.40" clip-path="url(#c${sfx})"/>

  <!-- cuff ribbing -->
  <g clip-path="url(#c${sfx})">${ribs.join('')}</g>

  <!-- side shading for 3-D cylinder look -->
  <rect width="80" height="100" fill="url(#g${sfx})" clip-path="url(#c${sfx})"/>

  <!-- fabric highlight top-left -->
  <path d="M8,0 L38,0 Q42,0 42,5 L42,32 Q26,26 14,18 L8,16 Z"
        fill="rgba(255,255,255,0.16)" clip-path="url(#c${sfx})"/>

  <!-- subtle outline -->
  <path d="${BODY_PATH}" fill="none" stroke="rgba(0,0,0,0.13)" stroke-width="1.5"/>
</svg>`;
}
// ──────────────────────────────────────────────────────────────────────────

// ─── Laundry obstacle items (immovable) ───────────────────────────────────
const OBSTACLE_DEFS = [
  { type:'towel',  color:'#f0ebe0', stripe:'#c8b8a0', w:95, h:62 },
  { type:'towel',  color:'#7ab8d8', stripe:'#5090b8', w:95, h:62 },
  { type:'towel',  color:'#e87060', stripe:'#c04040', w:95, h:62 },
  { type:'shirt',  color:'#5888d0', w:90, h:100 },
  { type:'shirt',  color:'#60b878', w:90, h:100 },
  { type:'shirt',  color:'#e89040', w:90, h:100 },
  { type:'hoodie', color:'#484858', w:90, h:105 },
  { type:'hoodie', color:'#8040a0', w:90, h:105 },
  { type:'pajama', color:'#c8d8f0', patCol:'#5070b0', w:82, h:118 },
  { type:'pajama', color:'#f8e0a0', patCol:'#c08040', w:82, h:118 },
];

function createObstacleSVG(def, sfx) {
  switch (def.type) {
    case 'towel':  return _towelSVG(def, sfx);
    case 'shirt':  return _shirtSVG(def, sfx);
    case 'hoodie': return _hoodieSVG(def, sfx);
    case 'pajama': return _pajamaSVG(def, sfx);
    default: return '';
  }
}

function _towelSVG(d, s) {
  const lines = [];
  for (let y = 11; y < 54; y += 9)
    lines.push(`<line x1="4" y1="${y}" x2="96" y2="${y}" stroke="rgba(0,0,0,0.11)" stroke-width="2.5"/>`);
  return `<svg viewBox="0 0 100 62" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;overflow:visible">
  <defs>
    <filter id="of${s}"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.22)"/></filter>
    <clipPath id="oc${s}"><rect x="4" y="2" width="92" height="58" rx="7"/></clipPath>
  </defs>
  <rect x="4" y="2" width="92" height="58" rx="7" fill="${d.color}" filter="url(#of${s})"/>
  <g clip-path="url(#oc${s})">${lines.join('')}</g>
  <rect x="4" y="2"  width="92" height="11" rx="7" fill="${d.stripe}" opacity="0.60" clip-path="url(#oc${s})"/>
  <rect x="4" y="50" width="92" height="10" rx="7" fill="${d.stripe}" opacity="0.60" clip-path="url(#oc${s})"/>
  <line x1="50" y1="2" x2="50" y2="60" stroke="rgba(0,0,0,0.08)" stroke-width="1.5" stroke-dasharray="5,4" clip-path="url(#oc${s})"/>
  <rect x="4" y="2" width="92" height="58" rx="7" fill="none" stroke="rgba(0,0,0,0.10)" stroke-width="1.5"/>
</svg>`;
}

function _shirtSVG(d, s) {
  const P = 'M35,2 Q50,10 65,2 L90,18 Q95,20 95,27 L87,41 Q81,45 75,41 L75,90 Q75,96 68,96 L32,96 Q25,96 25,90 L25,41 Q19,45 13,41 L5,27 Q5,20 10,18 Z';
  return `<svg viewBox="0 0 100 98" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;overflow:visible">
  <defs>
    <filter id="of${s}"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.25)"/></filter>
    <clipPath id="oc${s}"><path d="${P}"/></clipPath>
    <linearGradient id="og${s}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(0,0,0,0.16)"/>
      <stop offset="28%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="72%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.18)"/>
    </linearGradient>
  </defs>
  <path d="${P}" fill="${d.color}" filter="url(#of${s})"/>
  <path d="M35,2 Q50,10 65,2 Q62,9 50,11 Q38,9 35,2 Z" fill="rgba(0,0,0,0.14)" clip-path="url(#oc${s})"/>
  <rect width="100" height="98" fill="url(#og${s})" clip-path="url(#oc${s})"/>
  <path d="M35,2 L65,2 Q62,7 50,9 Q38,7 35,2 Z" fill="rgba(255,255,255,0.18)" clip-path="url(#oc${s})"/>
  <path d="${P}" fill="none" stroke="rgba(0,0,0,0.11)" stroke-width="1.5"/>
</svg>`;
}

function _hoodieSVG(d, s) {
  const BODY = 'M22,28 L78,28 L92,20 Q96,20 96,28 L88,42 Q82,46 76,42 L76,92 Q76,98 68,98 L32,98 Q24,98 24,92 L24,42 Q18,46 12,42 L4,28 Q4,20 8,20 Z';
  const HOOD = 'M22,28 Q50,0 78,28 Q68,35 50,36 Q32,35 22,28 Z';
  const PCKT = 'M36,68 L64,68 Q67,68 67,72 L67,86 Q67,89 64,89 L36,89 Q33,89 33,86 L33,72 Q33,68 36,68 Z';
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;overflow:visible">
  <defs>
    <filter id="of${s}"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.25)"/></filter>
    <clipPath id="oc${s}"><path d="${BODY}"/></clipPath>
    <linearGradient id="og${s}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(0,0,0,0.18)"/>
      <stop offset="28%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="72%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.20)"/>
    </linearGradient>
  </defs>
  <path d="${HOOD}" fill="${d.color}" opacity="0.80"/>
  <path d="${HOOD}" fill="rgba(0,0,0,0.18)"/>
  <path d="${BODY}" fill="${d.color}" filter="url(#of${s})"/>
  <rect width="100" height="100" fill="url(#og${s})" clip-path="url(#oc${s})"/>
  <path d="${PCKT}" fill="rgba(0,0,0,0.12)" clip-path="url(#oc${s})"/>
  <path d="${PCKT}" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="1.5" clip-path="url(#oc${s})"/>
  <line x1="50" y1="28" x2="50" y2="68" stroke="rgba(0,0,0,0.18)" stroke-width="1.5" clip-path="url(#oc${s})"/>
  <path d="${BODY}" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1.5"/>
</svg>`;
}

function _pajamaSVG(d, s) {
  const PANTS = 'M4,0 L76,0 L76,108 Q76,115 68,115 L50,115 Q44,115 44,108 L44,52 L36,52 L36,108 Q36,115 30,115 L12,115 Q4,115 4,108 Z';
  const WAIST = 'M4,0 L76,0 L76,14 L4,14 Z';
  const lines = [];
  for (let y = 18; y < 115; y += 12)
    lines.push(`<line x1="4" y1="${y}" x2="76" y2="${y}" stroke="${d.patCol}" stroke-width="3" opacity="0.32"/>`);
  return `<svg viewBox="0 0 80 117" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;overflow:visible">
  <defs>
    <filter id="of${s}"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.22)"/></filter>
    <clipPath id="oc${s}"><path d="${PANTS}"/></clipPath>
    <linearGradient id="og${s}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(0,0,0,0.14)"/>
      <stop offset="25%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="75%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.16)"/>
    </linearGradient>
  </defs>
  <path d="${PANTS}" fill="${d.color}" filter="url(#of${s})"/>
  <g clip-path="url(#oc${s})">${lines.join('')}</g>
  <path d="${WAIST}" fill="rgba(0,0,0,0.15)" clip-path="url(#oc${s})"/>
  <line x1="4"  y1="5" x2="76" y2="5" stroke="rgba(255,255,255,0.40)" stroke-width="1.5" clip-path="url(#oc${s})"/>
  <line x1="4"  y1="9" x2="76" y2="9" stroke="rgba(255,255,255,0.40)" stroke-width="1.5" clip-path="url(#oc${s})"/>
  <line x1="40" y1="14" x2="40" y2="52" stroke="rgba(0,0,0,0.20)" stroke-width="1.5" clip-path="url(#oc${s})"/>
  <rect width="80" height="117" fill="url(#og${s})" clip-path="url(#oc${s})"/>
  <path d="${PANTS}" fill="none" stroke="rgba(0,0,0,0.11)" stroke-width="1.5"/>
</svg>`;
}
// ──────────────────────────────────────────────────────────────────────────

let socks = [], selected = [null, null], pairs = 0, totalPairs = 0, misses = 0;
let timerInterval = null, seconds = 0;
let drag = null;
let obstacles = [];

function startGame() {
  clearInterval(timerInterval);
  seconds = 0; pairs = 0; misses = 0; selected = [null, null];
  document.getElementById('overlay').classList.remove('show');
  updateStats();

  const pairTypes = SOCK_TYPES.slice(0, 7);
  totalPairs = pairTypes.length;
  socks = [];
  let id = 0;
  pairTypes.forEach(t => {
    socks.push({ uid: id++, type: t, paired: false, selected: false });
    socks.push({ uid: id++, type: t, paired: false, selected: false });
  });
  socks.push({ uid: id++, type: LONELY, paired: false, selected: false, lonely: true });
  socks.sort(() => Math.random() - 0.5);

  // assign random scatter positions for the laundry pile
  const grid = document.getElementById('basket-grid');
  const W = (grid.offsetWidth || 260) - 14;
  const H = 360, SW = 62, SH = 78;
  socks.forEach(sock => {
    sock.px  = 6 + Math.random() * Math.max(0, W - SW - 6);
    sock.py  = 6 + Math.random() * Math.max(0, H - SH - 6);
    sock.rot = (Math.random() - 0.5) * 90;
    sock.zi  = Math.floor(Math.random() * 25) + 1;
  });

  obstacles = OBSTACLE_DEFS.map((def, i) => ({
    def,
    px:  4 + Math.random() * Math.max(0, W - def.w - 4),
    py:  4 + Math.random() * Math.max(0, H - def.h - 4),
    rot: (Math.random() - 0.5) * 50,
    zi:  Math.floor(Math.random() * 25) + 1,
    id:  i,
  }));

  document.getElementById('total-pairs').textContent = totalPairs;
  document.getElementById('pairs-grid').innerHTML = '<span style="color:#ccc;font-size:0.8rem;padding:4px;">まだなし</span>';
  resetSlots();
  renderBasket();

  timerInterval = setInterval(() => {
    seconds++;
    const m = Math.floor(seconds / 60), s = seconds % 60;
    document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

function renderBasket() {
  const grid = document.getElementById('basket-grid');
  grid.innerHTML = '';

  // render immovable laundry items
  obstacles.forEach(ob => {
    const el = document.createElement('div');
    el.className = 'laundry-item';
    el.style.left   = ob.px + 'px';
    el.style.top    = ob.py + 'px';
    el.style.width  = ob.def.w + 'px';
    el.style.height = ob.def.h + 'px';
    el.style.zIndex = ob.zi;
    el.style.setProperty('--rot', ob.rot + 'deg');
    el.innerHTML = createObstacleSVG(ob.def, `o${ob.id}`);
    grid.appendChild(el);
  });

  socks.filter(s => !s.paired).forEach(sock => {
    const card = document.createElement('div');
    card.className = 'sock-card' + (sock.selected ? ' selected' : '');
    card.style.left    = sock.px + 'px';
    card.style.top     = sock.py + 'px';
    card.style.zIndex  = sock.zi;
    card.style.setProperty('--rot', sock.rot + 'deg');
    card.innerHTML = createSockSVG(sock.type, `b${sock.uid}`);
    card.addEventListener('pointerdown', e => onSockDown(e, sock.uid));
    grid.appendChild(card);
  });
}

// ─── Drag & drop ──────────────────────────────────────────────────────────
function onSockDown(e, uid) {
  const sock = socks.find(s => s.uid === uid);
  if (!sock || sock.paired) return;
  e.preventDefault();

  const rect = e.currentTarget.getBoundingClientRect();
  const ox = e.clientX - rect.left;
  const oy = e.clientY - rect.top;

  const ghost = document.createElement('div');
  ghost.style.cssText = 'position:fixed;width:70px;height:88px;pointer-events:none;z-index:9999;opacity:0.92;';
  ghost.style.filter    = 'drop-shadow(5px 8px 12px rgba(0,0,0,0.45))';
  ghost.style.transform = `rotate(${sock.rot + 8}deg) scale(1.15)`;
  ghost.innerHTML = createSockSVG(sock.type, `dg${uid}`);
  document.body.appendChild(ghost);

  drag = { uid, ghost, ox, oy, sx: e.clientX, sy: e.clientY };
  positionGhost(e.clientX, e.clientY);

  document.addEventListener('pointermove', onDragMove, { passive: false });
  document.addEventListener('pointerup',     onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);
}

function positionGhost(cx, cy) {
  drag.ghost.style.left = (cx - drag.ox) + 'px';
  drag.ghost.style.top  = (cy - drag.oy) + 'px';
}

function onDragMove(e) {
  if (!drag) return;
  e.preventDefault();
  positionGhost(e.clientX, e.clientY);
  ['slot-a', 'slot-b'].forEach(id => {
    const r = document.getElementById(id).getBoundingClientRect();
    document.getElementById(id).classList.toggle('drag-over',
      e.clientX >= r.left && e.clientX <= r.right &&
      e.clientY >= r.top  && e.clientY <= r.bottom);
  });
}

function onDragEnd(e) {
  if (!drag) return;
  drag.ghost.remove();
  ['slot-a', 'slot-b'].forEach(id =>
    document.getElementById(id).classList.remove('drag-over'));

  const moved = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
  const slot  = getSlotAt(e.clientX, e.clientY);

  if (slot) {
    dropOnSlot(drag.uid, slot);
  } else if (moved < 10) {
    selectSock(drag.uid);
  }

  drag = null;
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup',     onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);
}

function getSlotAt(x, y) {
  for (const id of ['slot-a', 'slot-b']) {
    const r = document.getElementById(id).getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return id;
  }
  return null;
}

function dropOnSlot(uid, slotId) {
  const idx   = slotId === 'slot-a' ? 0 : 1;
  const other = 1 - idx;
  const sock  = socks.find(s => s.uid === uid);
  if (!sock || uid === selected[other]) return;

  if (selected[idx] !== null) {
    const prev = socks.find(s => s.uid === selected[idx]);
    if (prev) prev.selected = false;
  }

  sock.selected = true;
  selected[idx] = uid;

  renderBasket();
  updateSlots();
  document.getElementById('match-btn').disabled =
    selected.filter(s => s !== null).length < 2;
}
// ──────────────────────────────────────────────────────────────────────────

function selectSock(uid) {
  const sock = socks.find(s => s.uid === uid);
  if (!sock || sock.paired) return;

  if (sock.selected) {
    sock.selected = false;
    if (selected[0] === uid) selected[0] = null;
    else selected[1] = null;
  } else {
    if (selected[0] === null) { selected[0] = uid; sock.selected = true; }
    else if (selected[1] === null && selected[0] !== uid) { selected[1] = uid; sock.selected = true; }
  }

  renderBasket();
  updateSlots();
  document.getElementById('match-btn').disabled = selected.filter(s => s !== null).length < 2;
}

function updateSlots() {
  ['a','b'].forEach((slot, i) => {
    const el = document.getElementById(`slot-${slot}`);
    const uid = selected[i];
    if (uid !== null) {
      const sock = socks.find(s => s.uid === uid);
      el.className = 'slot filled';
      el.innerHTML = `<div style="width:54px;height:64px">${createSockSVG(sock.type, `sl${slot}${uid}`)}</div><button class="remove-btn" onclick="removeSock(${uid})">&#x2715;</button>`;
    } else {
      el.className = 'slot';
      el.innerHTML = '<span style="color:#ccc;font-size:1rem">?</span>';
    }
  });
}

function removeSock(uid) {
  const sock = socks.find(s => s.uid === uid);
  if (sock) sock.selected = false;
  if (selected[0] === uid) selected[0] = null;
  else if (selected[1] === uid) selected[1] = null;
  renderBasket(); updateSlots();
  document.getElementById('match-btn').disabled = true;
}

function resetSlots() { selected = [null, null]; updateSlots(); document.getElementById('match-btn').disabled = true; }

function tryMatch() {
  const [uid1, uid2] = selected;
  if (uid1 === null || uid2 === null) return;
  const s1 = socks.find(s => s.uid === uid1), s2 = socks.find(s => s.uid === uid2);

  if (s1.type.id === s2.type.id && !s1.lonely && !s2.lonely) {
    s1.paired = s2.paired = true;
    s1.selected = s2.selected = false;
    pairs++;
    const grid = document.getElementById('pairs-grid');
    if (grid.querySelector('span[style]')) grid.innerHTML = '';
    const chip = document.createElement('div');
    chip.className = 'pair-chip';
    const cid = Date.now();
    chip.innerHTML = `<div class="chip-sock">${createSockSVG(s1.type, `cp${cid}a`)}</div><div class="chip-sock">${createSockSVG(s1.type, `cp${cid}b`)}</div>`;
    grid.appendChild(chip);
    showToast(`&#x2705; ${s1.type.name} のペア完成！`);
    resetSlots(); renderBasket(); updateStats();
    if (pairs >= totalPairs) setTimeout(showResult, 400);
  } else {
    misses++;
    updateStats();
    showToast('&#x274C; 違う！片割れだ…');
    s1.selected = s2.selected = false;
    selected = [null, null];
    renderBasket(); resetSlots();
  }
}

function updateStats() {
  document.getElementById('pair-count').textContent = pairs;
  document.getElementById('miss-count').textContent = misses;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function showResult() {
  clearInterval(timerInterval);
  const m = Math.floor(seconds / 60), s = seconds % 60;
  document.getElementById('result-msg').textContent =
    `${totalPairs}ペア完成！ タイム: ${m}:${s.toString().padStart(2,'0')}　ミス: ${misses}回`;
  const badge = document.getElementById('lonely-badge');
  badge.style.display = 'block';
  badge.textContent = '🌸「謎の花柄」の片割れは永遠に見つかりませんでした';
  document.getElementById('overlay').classList.add('show');
}

startGame();
</script>
